<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#140c08" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@900&display=swap"
      rel="stylesheet"
    />
    <meta name="robots" content="noindex, nofollow" />
    <title>장기 3D</title>
    <style>
      html, body { margin: 0; height: 100%; background: #140c08; }
      #boot {
        position: fixed; inset: 0; z-index: 50; display: flex; flex-direction: column; gap: 18px;
        align-items: center; justify-content: center; background: #140c08; color: #d6a85c;
        font: 500 17px 'Noto Sans KR', sans-serif; letter-spacing: 0.08em; transition: opacity 0.5s;
      }
      #boot .ring {
        width: 44px; height: 44px; border-radius: 50%;
        border: 3px solid rgba(214, 168, 92, 0.2); border-top-color: #f3d08a;
        animation: bootspin 0.9s linear infinite;
      }
      @keyframes bootspin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="boot"><div class="ring"></div>원목을 깎는 중…</div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
